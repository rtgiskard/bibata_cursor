name: build

on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: "Build Cursors Themes (Arch)"
    runs-on: ubuntu-latest
    container:
      image: archlinux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          pacman --noconfirm --noprogressbar -Syu --needed \
            xorg-xcursorgen librsvg \
            ruff uv

      - name: Check with linter and formatter
        run: |
          ruff check
          ruff format --check

      - name: Test cursor generation
        run: uv run python -m unittest discover -s tests -v

      - name: Build scalable SVG cursors
        run: |
          uv run ./src/cursor_utils.py --svg --log-level debug --out-dir out.svg
          cd out.svg && for x in Bibata-*; do \
              tar -acf ../"${x}.svg.tar.zst" "$x"; \
          done

      - name: Build hyprcursor
        run: |
          uv run ./src/cursor_utils.py --hypr --log-level debug --out-dir out.hypr
          cd out.hypr && for x in Bibata-*; do \
              tar -acf ../"${x}.hypr.tar.zst" "$x"; \
          done

      - name: Build Xcursor
        run: |
          uv run ./src/cursor_utils.py --x11 --log-level debug --out-dir out.x11
          cd out.x11 && for x in Bibata-*; do \
              tar -acf ../"${x}.x11.tar.zst" "$x"; \
          done

      - name: Upload release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cursor-themes
          if-no-files-found: error
          path: |
            *.svg.tar.zst
            *.hypr.tar.zst
            *.x11.tar.zst

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.2
        with:
          name: cursor-themes

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            *.svg.tar.zst
            *.hypr.tar.zst
            *.x11.tar.zst
